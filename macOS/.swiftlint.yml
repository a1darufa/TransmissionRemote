# SwiftLint configuration for the whole repository.
#
# The SwiftLint build tool plugin applies it on every build of the app target.
# Packages/TransmissionKit/.swiftlint.yml inherits it for the package's own plugin runs,
# because the plugin only looks for a configuration inside the package directory.

excluded:
  - build
  - DerivedData
  - Packages/TransmissionKit/.build
  - .claude

opt_in_rules:
  # Correctness and safety
  - fatal_error_message
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - overridden_super_call
  - private_swiftui_state
  - unhandled_throwing_task
  - unowned_variable_capture
  - weak_delegate
  # Clearer, faster collection code
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - reduce_into
  - sorted_first_last
  # Modern idioms
  - legacy_multiple
  - prefer_key_path
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - shorthand_optional_binding
  - toggle_bool
  # Consistent formatting
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - explicit_init
  - joined_default_parameter
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - sorted_imports
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

identifier_name:
  excluded:
    - "^id$"
    # Queue "Move Up" and the upload-speed column: no longer name says it better.
    - "^up$"

cyclomatic_complexity:
  # A switch that maps every enum case to a value reads best as one flat switch.
  ignores_case_statements: true
